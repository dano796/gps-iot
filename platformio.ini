; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	lewisxhe/XPowersLib@^0.3.3
	olikraus/U8g2@^2.36.18
	mikalhart/TinyGPSPlus@^1.1.0
	closedcube/ClosedCube HDC1080@^1.3.2

build_flags =
    ; Radio Config
    -D CONFIG_RADIO_FREQ=915.0
    -D CONFIG_RADIO_OUTPUT_POWER=17
    -D CONFIG_RADIO_BW=125.0
    -D HDC1080_ADDR=0x40
    
    ; Node Settings 
    -D NODE_ID='"516163"'          ; codigo de estudiante: campo "id" de la trama
    -D TX_INTERVAL_MS=10000
    
    ; Sensor & Pruning
    -D SENSOR_SAMPLES=8
    -D SENSOR_SAMPLE_MS=1000    ; 1 sps: maximo recomendado por el datasheet del HDC1080
    -D PRUNE_SIGMA=2.0f
    
    ; Debugging
    -D DEBUG_NMEA=0
